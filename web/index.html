<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конфигуратор кнопок</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314161a'/%3E%3Cg fill='%234ade80'%3E%3Crect x='5' y='8' width='6' height='6' rx='1.5'/%3E%3Crect x='13' y='8' width='6' height='6' rx='1.5'/%3E%3Crect x='21' y='8' width='6' height='6' rx='1.5'/%3E%3Crect x='5' y='17' width='6' height='6' rx='1.5'/%3E%3Crect x='13' y='17' width='6' height='6' rx='1.5'/%3E%3Crect x='21' y='17' width='6' height='6' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <div>
        <h1>Конфигуратор кнопок</h1>
        <p>Stream Controller X</p>
      </div>
    </div>
    <div class="status" id="status"><span class="dot"></span><span class="status-text">Подключение…</span></div>
    <div class="top-actions">
      <span class="dirty" id="dirty" hidden>Есть несохранённые изменения</span>
      <button class="icon-btn" id="undo" disabled title="Отменить действие (Ctrl+Z)" aria-label="Отменить действие"><span class="ui-ico" style="--src: url(/lucide/undo-2.svg)" aria-hidden="true"></span></button>
      <button class="icon-btn" id="redo" disabled title="Повторить (Ctrl+Y)" aria-label="Повторить"><span class="ui-ico" style="--src: url(/lucide/redo-2.svg)" aria-hidden="true"></span></button>
      <button class="btn ghost" id="revert" disabled title="Отменить все несохранённые изменения">Сбросить</button>
      <button class="btn primary" id="save" disabled>Сохранить <kbd>Ctrl+S</kbd></button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main class="layout">
    <!-- Слева — общие настройки, справа — выбранное: кнопка или страница -->
    <aside class="inspector page-side" id="global-panel" aria-label="Общие настройки"></aside>
    <section class="stage" id="stage">
      <nav class="tabs" id="tabs" aria-label="Страницы"></nav>
      <div class="device-wrap">
        <div class="device" id="device">
          <div class="device-well">
            <div class="keys" id="keys"></div>
          </div>
        </div>
        <div class="stand" aria-hidden="true"></div>
        <div class="floor" aria-hidden="true"></div>
      </div>
      <p class="stage-hint">Кликните по кнопке, чтобы настроить её · перетащите на другую, чтобы поменять местами</p>
    </section>
    <aside class="inspector key-side" id="inspector" aria-label="Настройки выбранного"></aside>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
